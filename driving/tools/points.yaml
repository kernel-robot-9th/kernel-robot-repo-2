# 이름 붙은 지점 — 그림 좌표 cm (왼쪽 아래 원점, y 위), 방향 deg (0 = +x, 90 = +y, 반시계 +)
# 위치는 모두 **라이다 중심** 기준. map_drawn 맵 좌표(m) = 값 / 100 (바퀴 축은 정면으로 1.7cm 앞)

omx_stop:         # OMX 정차점 (2026-10-21): 로봇을 놓은 자리를 스캔으로 찾고(아래 omx_approach) 정면 30cm
  xy: [98.9, 178.8]
  heading: 90       # OMX 쪽. 마지막 정렬은 ArUco 정밀 주차
omx_approach:     # 그때 로봇 자리 (스캔 탐색, 라이다 중심). 사용자 실측: 바퀴 축 (96, 152) = 라이다 (96, 150.3),
                  # 라이다→뒤 계단벽(y=100) 49.8cm. 스캔과 1~1.5cm 이내로 일치
  xy: [97.3, 148.8]
  heading: 87.0
omx_marker:       # 선반 끝 = 아레나 경계 (y=200), ArUco 마커
  xy: [98.9, 200]
pharmacy_door:    # 약제실 문 (y=160), x 79~116 (2026-10-21 정정)
  x: [79, 116]

start_A:          # SLAM 출발점 / AMCL 기본 시작 위치
  xy: [182.7, 24.0]
  heading: 180

markers:          # 바닥 표시점 (marker_check.py)
  A: [182.7, 24.0, 180]
  B: [130, 15, 90]
  C: [130, 80, 90]
  D: [130, 145, 180]
  F: [40, 145, 270]
  G: [40, 80, 270]
