# 실제로 세운 벽 (0.5cm 폼보드) — 직접 그린 맵(make_drawn_map.py)의 원본
# 좌표: 그림 왼쪽 아래 = (0,0), x 오른쪽, y 위쪽, cm (아레나 210 x 200)
# 출처: 사용자 실측 그림 (2026-10-21). 숫자는 0 또는 210 중 가까운 쪽에서 잰 값을 x 로 환산.
# y = 0 은 아래 바깥벽(실제 건물 벽)의 바닥 패널 앞면이다 (실측 기준). 패널은 두께 약 1cm, 라이다보다 낮아 안 보이고
# 라이다는 패널 뒤 벽면(y = -1)을 본다.
# 각 항목: [x1, y1, x2, y2] 직선, 또는 polyline: [[x, y], ...]

outer:
  bottom: [0, -1, 210, -1]              # 라이다가 보는 벽면 (패널 뒤)
  right: [210, -1, 210, 200]
  top_left: [0, 200, 66.0, 200]          # 실측 66.0 (0에서)
  top_left_stub: [66.0, 200, 66.0, 206]  # 바깥쪽으로 꺾인 토막 (길이는 그림에서 어림 6cm)
  top_right: [123.5, 200, 210, 200]      # 실측 86.5 (210에서) -> x 123.5
  top_right_stub: [123.5, 200, 123.5, 206]
  # 왼쪽 외벽: 다른 팀과 공유, 기울어짐. 라이다(map_rev3_rect) 띠 중심을 그대로 사용 (아래 left_polyline)

top_rooms:   # 4인실/약제실 아래 벽 (y=160) 조각
  pharmacy_left: [50.0, 160, 79.0, 160]       # 약제실 문 x 79~116 (2026-10-21 정정, 이전 50~90)
  pharmacy_left_stub: [79.0, 160, 79.0, 170]  # 길이 10.0 (약제실 안쪽으로), 문 왼쪽 끝
  pharmacy_right: [116.0, 160, 144.5, 160]    # 실측 65.5~94.0 (210에서) -> x 116.0~144.5
  pharmacy_right_stub: [116.0, 160, 116.0, 166]  # 길이 6.0

left_rooms:  # 왼쪽 1인실 2개 (사이 단일차선 협로 쪽은 열림)
  upper_top: [0, 130, 30, 130]
  upper_right: [30, 90, 30, 130]
  lower_right: [30, 30, 30, 70]
  lower_bottom: [0, 30, 30, 30]

center:      # 가운데 계단형 통로 경계
  upper: [[50, 90], [80, 90], [80, 100], [120, 100]]
  lower: [[50, 60], [90, 60], [90, 70], [120, 70]]

narrow_right:  # 오른쪽 협로의 긴 벽 (수술실 쪽) + 양 끝 토막
  long: [140, 30, 140, 130]
  top_stub: [140, 130, 161.5, 130]   # 긴 벽에서 21.5
  bottom_stub: [140, 30, 152.0, 30]  # 긴 벽에서 12.0

# 왼쪽 외벽 polyline 은 make_drawn_map.py 가 left_wall_measured.json 에서 읽는다

invisible:   # 라이다에 안 보이는 장애물 — AMCL 맵에는 그리지 않음. 경로 여유·그래프·차선 계산에만 사용. [x_min, y_min, x_max, y_max]
  bottom_panel: [0, -1, 210, 0]         # 아래 바깥벽 바닥 패널 (두께 약 1cm)
