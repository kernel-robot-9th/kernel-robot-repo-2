  - {a: L70, b: L80, mode: wall, zone: narrow_left, wall: [[30, 30], [30, 70]], wall2: [[30, 90], [30, 130]], note: y 70~90 은 벽 없음 → AMCL}
  - {a: L80, b: L102, mode: wall, zone: narrow_left, wall: [[30, 30], [30, 70]], wall2: [[30, 90], [30, 130]], note: y 70~90 은 벽 없음 → AMCL}
  - {a: L102, b: GT40D, mode: wall, zone: narrow_left, wall: [[30, 30], [30, 70]], wall2: [[30, 90], [30, 130]], note: y 70~90 은 벽 없음 → AMCL}
  - {a: L70, b: R90, mode: nav, zone: center_corr, note: '계단 통로 대각선 직선: 계단 모서리 (80,90)·(90,70) 정가운데를 지남'}
  - {a: GT99D, b: ROOM1_CUR, mode: nav, zone: room1_cur}
  - {a: GT175U, b: ROOM4_R, mode: nav, zone: room4_r}
  - {a: L102, b: ROOM1_CUL, mode: nav, zone: room1_cul}
