  - {a: S15, b: ROOM1_LU, mode: nav, zone: room1_lu}
  - {a: S15, b: ROOM1_LD, mode: nav, zone: room1_ld}
  - {a: T2_190, b: POCKET, mode: nav, zone: pocket, note: 복도 동쪽 끝 → 대기 포켓}
  - {a: ROOM4_L, b: GT40U, mode: nav, zone: room4_l}
