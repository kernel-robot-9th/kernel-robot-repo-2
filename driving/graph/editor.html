<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주행 그래프 편집기</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #dcdcd8; --accent: #2f6fdf;
    --warn: #c8402a; --ok: #2a8a4a;
    --m-line: #e89a1a; --m-transfer: #c27ac8; --m-wall: #d8323a; --m-nav: #36a04a; --deferred: #a9a9a9;
    --n-gate: #7a1f86; --n-way: #4a4a4a; --n-stop: #1d1d1f; --n-dock: #c400c4; --n-lane: #a3640a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 system-ui, -apple-system, "Noto Sans KR", sans-serif; color: var(--ink); background: var(--bg); }
  #app { display: grid; grid-template-columns: 1fr 330px; grid-template-rows: auto 1fr auto; height: 100vh; }
  header { grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header .grp { display: flex; gap: 4px; align-items: center; padding-right: 8px; margin-right: 4px; border-right: 1px solid var(--line); }
  header .grp:last-child { border-right: 0; }
  button, select, input { font: inherit; }
  button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 9px; cursor: pointer; color: var(--ink); }
  button:hover { border-color: #b8b8b4; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.danger { color: var(--warn); }
  button:disabled { opacity: .4; cursor: default; }
  kbd { font: 11px ui-monospace, monospace; color: var(--muted); }
  #stage { position: relative; overflow: hidden; background: #ececea; }
  svg { width: 100%; height: 100%; display: block; user-select: none; touch-action: none; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 12px 14px; }
  aside h2 { font-size: 14px; margin: 0 0 8px; }
  aside h3 { font-size: 12px; margin: 14px 0 6px; color: var(--muted); font-weight: 600; text-transform: none; }
  .row { display: grid; grid-template-columns: 78px 1fr; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row label { color: var(--muted); }
  .row input[type=text], .row input[type=number], .row select, .row textarea { width: 100%; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: #fff; }
  .row textarea { resize: vertical; min-height: 40px; font: inherit; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; background: #eee; margin: 1px 2px 1px 0; }
  .muted { color: var(--muted); }
  .warn { color: var(--warn); }
  .list div { padding: 3px 4px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
  .list div:hover { background: #f1f1ef; }
  footer { grid-column: 1 / 3; display: flex; gap: 14px; padding: 4px 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  footer .dirty { color: var(--warn); font-weight: 600; }
  #toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: .95; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 18px; height: 4px; border-radius: 2px; display: inline-block; }
  /* svg */
  .lbl { font: 600 2.7px system-ui, sans-serif; paint-order: stroke; stroke: #fff; stroke-width: .7px; fill: #222; pointer-events: none; }
  .lbl.small { font-size: 2.2px; fill: #6a4a10; }
  .edge-hit { stroke: transparent; stroke-width: 2.2; cursor: pointer; }
  .node { cursor: pointer; }
  .sel-ring { fill: none; stroke: var(--accent); stroke-width: .8; }
  @media (max-width: 760px) { #app { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto auto; } aside { border-left: 0; border-top: 1px solid var(--line); } header, footer { grid-column: 1; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="grp">
      <button data-tool="select" title="선택·이동 (V)">선택 <kbd>V</kbd></button>
      <button data-tool="way" title="경유점 추가 (W)">+경유점 <kbd>W</kbd></button>
      <button data-tool="gate" title="경계점 추가 (G)">+경계점 <kbd>G</kbd></button>
      <button data-tool="stop" title="목적지 추가 (S)">+목적지 <kbd>S</kbd></button>
      <button data-tool="edge" title="엣지 추가: 노드 두 개를 차례로 클릭 (E)">+엣지 <kbd>E</kbd></button>
    </div>
    <div class="grp">
      <span class="muted">새 엣지</span>
      <select id="newMode"><option>nav</option><option>wall</option><option>line</option><option>transfer</option></select>
      <input id="newZone" type="text" placeholder="zone" size="10" list="zones">
    </div>
    <div class="grp">
      <span class="muted">격자</span>
      <select id="snap"><option value="0.5">0.5cm</option><option value="1" selected>1cm</option><option value="2.5">2.5cm</option><option value="5">5cm</option></select>
    </div>
    <div class="grp">
      <button id="undo" title="되돌리기 (Ctrl+Z)">↶</button>
      <button id="redo" title="다시 (Ctrl+Y)">↷</button>
      <button id="fit" title="전체 보기 (F)">전체</button>
    </div>
    <div class="grp">
      <label><input type="checkbox" id="showBg" checked> 그림</label>
      <label><input type="checkbox" id="showWalls" checked> 실측 벽</label>
      <label><input type="checkbox" id="showGap" checked> 좁은 곳 표시</label>
      <label><input type="checkbox" id="showLaneLbl"> 차선 노드 이름</label>
    </div>
    <div class="grp">
      <button id="save" class="primary" title="저장 (Ctrl+S)">저장</button>
      <button id="reload" title="파일에서 다시 읽기">다시 읽기</button>
    </div>
  </header>
  <div id="stage"><svg id="svg"></svg></div>
  <aside id="panel"></aside>
  <footer><span id="pos">—</span><span id="toolHint"></span><span id="dirty"></span><span id="errs"></span></footer>
</div>
<datalist id="zones"></datalist>
<div id="toast"></div>

<script>
// ───────── 상태 ─────────
const NS = 'http://www.w3.org/2000/svg';
const MODES = ['line', 'transfer', 'wall', 'nav'];
const MODE_COL = { line: 'var(--m-line)', transfer: 'var(--m-transfer)', wall: 'var(--m-wall)', nav: 'var(--m-nav)' };
const IMG = { x: -76 / 3.39, y: -40 / 3.39, w: 825 / 3.39, h: 733 / 3.39 };   // layout_diagram.png 를 그림 cm 로
let spec = null, walls = [], built = { nodes: {}, edges: [], errors: [] };
let saved = '', undoStack = [], redoStack = [];
let tool = 'select', sel = null;            // sel: {kind:'node'|'lane'|'edge'|'auto', id}
let edgeStart = null, drag = null, pan = null;
let view = { x: -14, y: -8, w: 238, h: 218 };
const $ = (s) => document.querySelector(s);
const svg = $('#svg');
const fmt = (v) => (Math.round(v * 100) / 100).toString();
const sy = (y) => 200 - y;                   // 그림 y(위로 +) → svg y(아래로 +)

// ───────── 서버 ─────────
async function load() {
  let d = null;
  for (let i = 0; !d; i++) {   // 서버가 막 켜지는 중이면 다시 시도
    try { const r = await fetch('/api/state'); d = await r.json(); if (d.error) throw new Error(d.error); }
    catch (e) { d = null; $('#errs').textContent = `서버 연결 기다리는 중… (${e.message})`; $('#errs').className = 'warn'; await new Promise((ok) => setTimeout(ok, 1000)); }
  }
  spec = d.spec; walls = d.walls; saved = JSON.stringify(spec); undoStack = []; redoStack = []; sel = null;
  await preview(); render(); panel();
}
let pvTimer = null, pvSeq = 0;
function schedulePreview() { clearTimeout(pvTimer); pvTimer = setTimeout(async () => { await preview(); render(); if (!sel || sel.kind !== 'node' || !document.activeElement || document.activeElement.tagName === 'BODY') panel(); else updateGapInfo(); }, 250); }
async function preview() {
  const seq = ++pvSeq;
  try {
    const r = await fetch('/api/preview', { method: 'POST', body: JSON.stringify(spec) });
    const d = await r.json(); if (seq !== pvSeq) return;
    if (d.error) { built.errors = [d.error]; } else built = d;
  } catch (e) { built.errors = ['서버 연결 안 됨: ' + e]; }
  status();
}
async function save() {
  const r = await fetch('/api/save', { method: 'POST', body: JSON.stringify(spec) });
  const d = await r.json();
  if (d.error) { toast('저장 실패: ' + d.error); return; }
  saved = JSON.stringify(spec); status();
  toast(`저장됨 — ${d.summary}${d.errors.length ? ` (경고 ${d.errors.length})` : ''} · 이전 파일: ${d.backup}`);
}

// ───────── 편집 기록 ─────────
function change(fn) { const before = JSON.stringify(spec); fn(); const after = JSON.stringify(spec); if (before === after) return; undoStack.push(before); if (undoStack.length > 300) undoStack.shift(); redoStack = []; render(); schedulePreview(); status(); }
function undo() { if (!undoStack.length) return; redoStack.push(JSON.stringify(spec)); spec = JSON.parse(undoStack.pop()); fixSel(); render(); panel(); schedulePreview(); status(); }
function redo() { if (!redoStack.length) return; undoStack.push(JSON.stringify(spec)); spec = JSON.parse(redoStack.pop()); fixSel(); render(); panel(); schedulePreview(); status(); }
function fixSel() { if (sel && sel.kind === 'node' && !spec.nodes[sel.id]) sel = null; if (sel && sel.kind === 'edge' && !spec.edges[sel.id]) sel = null; }

// ───────── 좌표 ─────────
function svgPt(ev) { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse()); return { x: q.x, y: 200 - q.y }; }
function snapV(v, fine) { const s = fine ? 0.1 : parseFloat($('#snap').value); return Math.round(v / s) * s; }
function setView() { svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`); }
function fit() { view = { x: -14, y: -8, w: 238, h: 218 }; setView(); }

// ───────── 이름 도우미 ─────────
const laneIds = () => Object.keys(spec.lanes);
function laneNodeId(lane, x) { return `${lane}_${+fmt(x)}`; }
function corrLanes(cor) { return laneIds().filter((l) => spec.lanes[l].corridor === cor); }
function allNodeIds() { return new Set([...Object.keys(spec.nodes), ...Object.keys(built.nodes || {})]); }
function newId(prefix) { const ids = allNodeIds(); let i = 1; while (ids.has(prefix + i)) i++; return prefix + i; }
function nodeXY(id) { if (spec.nodes[id]) return spec.nodes[id].xy; const m = /^(.+)_(-?[\d.]+)$/.exec(id); if (m && spec.lanes[m[1]]) return [+m[2], spec.lanes[m[1]].y]; return null; }
function zonesList() { const z = new Set(); spec.edges.forEach((e) => e.zone && z.add(e.zone)); return [...z].sort(); }

// ───────── 그리기 ─────────
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function render() {
  if (!spec) return;
  svg.innerHTML = ''; setView();
  const root = el('g', {}, svg);
  if ($('#showBg').checked) el('image', { href: '/bg.png', x: IMG.x, y: IMG.y, width: IMG.w, height: IMG.h, opacity: 0.45, preserveAspectRatio: 'none' }, root);
  el('rect', { x: 0, y: 0, width: 210, height: 200, fill: 'none', stroke: '#999', 'stroke-width': 0.3, 'stroke-dasharray': '1 1' }, root);
  if ($('#showWalls').checked) for (const w of walls) {
    el('polyline', { points: w.pts.map((p) => `${p[0]},${sy(p[1])}`).join(' '), fill: w.invisible ? 'rgba(200,64,42,.15)' : 'none', stroke: w.invisible ? 'none' : '#222', 'stroke-width': 0.8, 'stroke-linecap': 'round' }, root);
  }
  // 차선 (가로 줄)
  for (const [ln, L] of Object.entries(spec.lanes)) {
    const xs = (spec.junctions[L.corridor] || []).slice().sort((a, b) => a - b);
    if (xs.length) el('text', { x: xs[0] - 9, y: sy(L.y) + 1, class: 'lbl small' }, root).textContent = ln;
  }
  // 엣지
  const gapMap = {}; (built.edges || []).forEach((e) => { gapMap[`${e.a}|${e.b}`] = e; });
  const showGap = $('#showGap').checked;
  const autoEdges = (built.edges || []).filter((e) => e.auto);
  const drawEdge = (a, b, e, key, isAuto) => {
    const pa = nodeXY(a), pb = nodeXY(b); if (!pa || !pb) return;
    const g = el('g', {}, root);
    const isSel = sel && ((sel.kind === 'edge' && !isAuto && sel.id === key) || (sel.kind === 'auto' && isAuto && sel.id === key));
    const info = gapMap[`${a}|${b}`];
    if (showGap && info && info.gap_bowl_cm < 1 && !e.deferred) el('line', { x1: pa[0], y1: sy(pa[1]), x2: pb[0], y2: sy(pb[1]), stroke: 'rgba(200,64,42,.28)', 'stroke-width': 3.2, 'stroke-linecap': 'round' }, g);
    if (isSel) el('line', { x1: pa[0], y1: sy(pa[1]), x2: pb[0], y2: sy(pb[1]), stroke: 'var(--accent)', 'stroke-width': 2.4, 'stroke-linecap': 'round', opacity: 0.5 }, g);
    const w = { line: 1.3, transfer: 0.6, wall: 1.3, nav: 0.9 }[e.mode] || 0.8;
    el('line', { x1: pa[0], y1: sy(pa[1]), x2: pb[0], y2: sy(pb[1]), stroke: e.deferred ? 'var(--deferred)' : (MODE_COL[e.mode] || '#000'), 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-dasharray': e.deferred ? '1.5 1' : (e.mode === 'transfer' ? '1 .6' : '') }, g);
    if (e.mode === 'wall' && e.wall && isSel) for (const k of ['wall', 'wall2']) if (e[k]) el('line', { x1: e[k][0][0], y1: sy(e[k][0][1]), x2: e[k][1][0], y2: sy(e[k][1][1]), stroke: 'var(--accent)', 'stroke-width': 1.2, opacity: 0.7 }, g);
    const hit = el('line', { x1: pa[0], y1: sy(pa[1]), x2: pb[0], y2: sy(pb[1]), class: 'edge-hit' }, g);
    hit.addEventListener('pointerdown', (ev) => { if (tool !== 'select') return; ev.stopPropagation(); sel = { kind: isAuto ? 'auto' : 'edge', id: key }; render(); panel(); });
  };
  autoEdges.forEach((e) => drawEdge(e.a, e.b, e, `${e.a}|${e.b}`, true));
  spec.edges.forEach((e, i) => drawEdge(e.a, e.b, e, i, false));
  // 차선 노드
  const laneSkip = new Set(spec.lane_skip || []);   // 못 가는 차선 노드 (graph_spec lane_skip, 예: T2_20 콘센트 자리)
  for (const [ln, L] of Object.entries(spec.lanes)) for (const x of spec.junctions[L.corridor] || []) {
    const id = laneNodeId(ln, x); if (laneSkip.has(id)) continue; const isSel = sel && sel.kind === 'lane' && sel.id === id;
    const g = el('g', { class: 'node' }, root);
    if (isSel) el('circle', { cx: x, cy: sy(L.y), r: 2.4, class: 'sel-ring' }, g);
    if (jinfo(L.corridor, x).role === 'wait') el('circle', { cx: x, cy: sy(L.y), r: 2.2, fill: 'none', stroke: 'var(--m-line)', 'stroke-width': 0.5 }, g);
    el('circle', { cx: x, cy: sy(L.y), r: 1.1, fill: 'var(--n-lane)' }, g);
    el('circle', { cx: x, cy: sy(L.y), r: 2.6, fill: 'transparent' }, g);
    if ($('#showLaneLbl').checked || isSel) el('text', { x: x + 1.5, y: sy(L.y) - 1.4, class: 'lbl small' }, g).textContent = id;
    else if (ln === corrLanes(L.corridor)[0]) el('text', { x: x - 2, y: sy(L.y) + (L.corridor === 'B' ? 4.5 : -2.5), class: 'lbl small' }, g).textContent = fmt(x);
    g.addEventListener('pointerdown', (ev) => nodeDown(ev, 'lane', id));
  }
  // 노드
  for (const [id, n] of Object.entries(spec.nodes)) {
    const [x, y] = n.xy; const isSel = sel && sel.kind === 'node' && sel.id === id;
    const g = el('g', { class: 'node' }, root);
    const dim = n.deferred;
    if (isSel || (edgeStart === id)) el('circle', { cx: x, cy: sy(y), r: n.type === 'stop' ? 3.6 : 2.6, class: 'sel-ring' }, g);
    if (n.type === 'stop') {
      el('circle', { cx: x, cy: sy(y), r: 2.3, fill: dim ? 'var(--deferred)' : (n.dock ? 'var(--n-dock)' : 'var(--n-stop)') }, g);
      const h = (n.heading || 0) * Math.PI / 180;
      el('line', { x1: x, y1: sy(y), x2: x + 4.6 * Math.cos(h), y2: sy(y) - 4.6 * Math.sin(h), stroke: '#fff', 'stroke-width': 0.7, 'stroke-linecap': 'round' }, g);
      el('circle', { cx: x + 4.6 * Math.cos(h), cy: sy(y) - 4.6 * Math.sin(h), r: 0.7, fill: dim ? 'var(--deferred)' : 'var(--n-stop)', stroke: '#fff', 'stroke-width': 0.3 }, g);
    } else {
      el('circle', { cx: x, cy: sy(y), r: n.type === 'gate' ? 1.4 : 1.2, fill: dim ? 'var(--deferred)' : (n.type === 'gate' ? 'var(--n-gate)' : 'var(--n-way)') }, g);
    }
    el('text', { x: x + 2, y: sy(y) - 2, class: 'lbl' }, g).textContent = id;
    el('circle', { cx: x, cy: sy(y), r: 3, fill: 'transparent' }, g);   // 잡기 쉬운 클릭 영역
    g.addEventListener('pointerdown', (ev) => nodeDown(ev, 'node', id));
  }
}

// ───────── 마우스 ─────────
function nodeDown(ev, kind, id) {
  ev.stopPropagation();
  if (tool === 'edge') {
    if (!edgeStart) { edgeStart = id; render(); hint(); return; }
    if (edgeStart === id) { edgeStart = null; render(); hint(); return; }
    const a = edgeStart, b = id; edgeStart = null;
    if (spec.edges.some((e) => (e.a === a && e.b === b) || (e.a === b && e.b === a))) { toast('이미 있는 엣지예요'); render(); return; }
    change(() => { const e = { a, b, mode: $('#newMode').value }; const z = $('#newZone').value.trim(); if (z) e.zone = z; spec.edges.push(e); sel = { kind: 'edge', id: spec.edges.length - 1 }; });
    panel(); hint(); return;
  }
  if (tool !== 'select') return;
  sel = { kind, id }; panel();
  const p = svgPt(ev);
  const start = kind === 'node' ? spec.nodes[id].xy.slice() : nodeXY(id);
  drag = { kind, id, start, p0: p, before: JSON.stringify(spec), moved: false };
  svg.setPointerCapture(ev.pointerId);
  render();
}
svg.addEventListener('pointerdown', (ev) => {
  const p = svgPt(ev);
  if (['way', 'gate', 'stop'].includes(tool)) {
    const x = snapV(p.x, ev.shiftKey), y = snapV(p.y, ev.shiftKey);
    change(() => {
      const prefix = { way: 'W', gate: 'G', stop: 'STOP' }[tool];
      const id = newId(prefix); const n = { type: tool, xy: [+fmt(x), +fmt(y)] };
      if (tool === 'stop') { n.heading = 90; n.name = ''; }
      if (tool === 'gate') { const cor = Object.keys(spec.junctions)[0]; n.jct = [cor, nearestJ(cor, x)]; }
      spec.nodes[id] = n; sel = { kind: 'node', id };
    });
    panel(); return;
  }
  if (tool === 'edge') { edgeStart = null; render(); hint(); return; }
  if (sel) { sel = null; render(); panel(); }
  pan = { cx: ev.clientX, cy: ev.clientY, v: { ...view } }; svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener('pointermove', (ev) => {
  const p = svgPt(ev);
  $('#pos').textContent = `x ${p.x.toFixed(1)}  y ${p.y.toFixed(1)} cm`;
  if (drag) {
    const dx = p.x - drag.p0.x, dy = p.y - drag.p0.y;
    if (!drag.moved && Math.hypot(dx, dy) < 0.6) return;
    drag.moved = true;
    if (drag.kind === 'node') { spec.nodes[drag.id].xy = [+fmt(snapV(drag.start[0] + dx, ev.shiftKey)), +fmt(snapV(drag.start[1] + dy, ev.shiftKey))]; }
    else { drag.newX = +fmt(snapV(drag.start[0] + dx, ev.shiftKey)); drag.ghost = true; }
    render();
    if (drag.kind === 'lane') { const L = spec.lanes[drag.id.split('_')[0]]; el('circle', { cx: drag.newX, cy: sy(L.y), r: 1.6, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 0.5 }, svg); $('#pos').textContent += `  → 갈림목 x ${drag.newX}`; }
    return;
  }
  if (pan) { const k = 1 / svg.getScreenCTM().a; view.x = pan.v.x - (ev.clientX - pan.cx) * k; view.y = pan.v.y - (ev.clientY - pan.cy) * k; setView(); }
});
svg.addEventListener('pointerup', () => {
  if (drag && drag.moved) {
    if (drag.kind === 'node') { undoStack.push(drag.before); redoStack = []; schedulePreview(); status(); panel(); }
    else if (drag.newX !== undefined) { const [ln, xs] = splitLane(drag.id); moveJunction(spec.lanes[ln].corridor, +xs, drag.newX); }
  }
  drag = null; pan = null;
});
svg.addEventListener('wheel', (ev) => {
  ev.preventDefault(); const k = ev.deltaY > 0 ? 1.12 : 1 / 1.12;
  const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse());

}
function hint() {
  const t = { select: '노드 끌기 · 빈 곳 끌기 = 이동 · 휠 = 확대', way: '지도를 클릭해 경유점 추가', gate: '지도를 클릭해 경계점 추가', stop: '지도를 클릭해 목적지 추가', edge: edgeStart ? `${edgeStart} → 두 번째 노드 클릭 (Esc 취소)` : '첫 번째 노드 클릭' }[tool];
  $('#toolHint').textContent = t;
}
function setTool(t) { tool = t; edgeStart = null; document.querySelectorAll('[data-tool]').forEach((b) => b.classList.toggle('on', b.dataset.tool === t)); hint(); render(); }
let toastT = null;
function toast(s) { const t = $('#toast'); t.textContent = s; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3500); }

// ───────── 이벤트 ─────────
document.querySelectorAll('[data-tool]').forEach((b) => b.addEventListener('click', () => setTool(b.dataset.tool)));
$('#undo').onclick = undo; $('#redo').onclick = redo; $('#fit').onclick = fit; $('#save').onclick = save;
$('#reload').onclick = () => { if (JSON.stringify(spec) !== saved && !confirm('저장 안 한 변경을 버리고 파일에서 다시 읽을까요?')) return; load(); };
['#showBg', '#showWalls', '#showGap', '#showLaneLbl'].forEach((s) => $(s).addEventListener('change', render));
document.addEventListener('keydown', (ev) => {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); save(); return; }
  if (typing) return;
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'y') { ev.preventDefault(); redo(); return; }
  const k = ev.key.toLowerCase();
  if (k === 'delete' || k === 'backspace') { ev.preventDefault(); deleteSel(); }
  else if (k === 'escape') { edgeStart = null; sel = null; setTool('select'); panel(); }
  else if (k === 'v') setTool('select'); else if (k === 'w') setTool('way'); else if (k === 'g') setTool('gate');
  else if (k === 's') setTool('stop'); else if (k === 'e') setTool('edge'); else if (k === 'f') fit();
});
window.addEventListener('beforeunload', (ev) => { if (spec && JSON.stringify(spec) !== saved) { ev.preventDefault(); ev.returnValue = ''; } });
setTool('select'); load();
</script>
</body>
