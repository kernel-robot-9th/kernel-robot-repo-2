server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # react-router: /deliveries 같은 경로를 새로고침해도 index.html 로
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 해시 붙은 번들은 오래 캐시
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
