# =============================================================================
# EMR 비품·배송 — 한 번에 띄우기
#   docker compose up --build
#   web  http://localhost:5173   (Vite 핫리로드, frontend/ 수정 즉시 반영)
#   api  http://localhost:8000/docs  (uvicorn --reload, backend/ 수정 즉시 반영)
#   db   localhost:5432  (emr/emr/emr)
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: emr
      POSTGRES_PASSWORD: emr
      POSTGRES_DB: emr
    ports:
      - "127.0.0.1:5432:5432"   # 이 PC 안에서만 (개발 계정 emr/emr — 2026-10-23 보안). api는 컨테이너 네트워크의 db로 접속
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emr -d emr"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://emr:emr@db:5432/emr   # 컨테이너 안에서는 host가 db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: 480
      CORS_ORIGINS: '["http://localhost:5173"]'
      SEED: ${SEED:-0}
      AUTH_DISABLED: ${AUTH_DISABLED:-0}   # 1이면 로그인(JWT) 끔 — 누구나 관리자(N001)로 (2026-10-22, 시연·시험용)
      ROBOT_KEY_DISABLED: ${ROBOT_KEY_DISABLED:-0}   # 1이면 로봇 API 키 끔 — 키 없으면 로봇 1호로 (2026-10-22, 시연·시험용)
      VOICE_PARSER: ${VOICE_PARSER:-disabled}   # gemini면 음성 배송 예약 초안 켬 — 녹음이 Google 클라우드로 나간다 (2026-10-26)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}       # .env에만 둔다
      FMS_BASE_URL: ${FMS_BASE_URL:-}           # 팀원 FMS API v1 주소 — 비우면 끔 (2026-10-27, 계약 10장)
      FMS_OMX_ENABLED: ${FMS_OMX_ENABLED:-0}    # 1이면 FMS 묶음을 실제 OMX로 싣는다 — 로봇팔이 움직인다 (2026-10-27, 계약 10.4)
      OMX_BASE_URL: ${OMX_BASE_URL:-http://10.42.0.147:8000}   # 팀원 OMX 주소 (10-28 바뀜). 컨테이너가 직접 못 닿으면 .env로 중계 주소
      FMS_PHARMACY_SIGNAL: ${FMS_PHARMACY_SIGNAL:-fms}   # pinky = 실물 Pinky /robot/arrived를 정밀 주차 끝으로 (FMS가 가상인 동안, 10-28)
      OMX_COMMAND_FORMAT: ${OMX_COMMAND_FORMAT:-counts}   # sentence = 임시: 수량 무시하고 거즈 문장 (10-27, 실제 OMX가 문장만 받는 동안)
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # 코드 핫리로드
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api/v1}   # 같은 주소 → Vite 프록시. 다른 PC에서 IP로 접속해도 동작
      API_PROXY_TARGET: http://api:8000         # Vite 프록시가 넘길 백엔드 (컨테이너 안 주소)
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
