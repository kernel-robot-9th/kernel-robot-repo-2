# tools/ws_interface_test/mqtt/mosquitto.conf — 인터페이스 시험용 브로커 (2026-10-22)
# 인증·암호화 없음: 시험망에서만. 메시지는 디스크에 남기지 않는다.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# MQTT (TCP) — 로봇·파이썬 클라이언트
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# MQTT over WebSocket — 브라우저용 (mqtt.js 등)
listener 9001 0.0.0.0
protocol websockets
