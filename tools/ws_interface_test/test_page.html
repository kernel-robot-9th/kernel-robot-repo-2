<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebSocket·MQTT 인터페이스 시험</title>
<!-- tools/ws_interface_test/test_page.html — 서버(server.py)가 http://<host>:8765/ 로 준다. 규격은 /specs.json (messages.py) -->
<style>
  :root { --bg:#f5f6f8; --panel:#fff; --fg:#1e2430; --muted:#646c7a; --line:#d8dce3; --accent:#2b5fb4;
          --in:#eef4ff; --out:#f1f8f1; --err:#fdecea; --errfg:#a3302a; --ok:#1d6b34; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171d; --panel:#1c2029; --fg:#e4e7ed; --muted:#9aa2b1; --line:#323846;
          --accent:#86aef0; --in:#1b2638; --out:#1b2c20; --err:#3a1e1d; --errfg:#f2958f; --ok:#8fdca3; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, "Noto Sans KR", sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; grid-template-columns: 360px 1fr; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; align-content: start; min-width: 0; }
  h1 { grid-column: 1 / -1; font-size: 18px; margin: 0; }
  h2 { font-size: 13px; margin: 0; color: var(--muted); letter-spacing: .03em; }
  label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  input, select, textarea, button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  textarea { font-family: ui-monospace, Menlo, monospace; font-size: 12px; min-height: 150px; resize: vertical; }
  button { cursor: pointer; background: var(--accent); color: #fff; border: 0; font-weight: 600; }
  button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  .row > * { flex: 1; min-width: 0; }
  label > input, label > select { width: 100%; min-width: 0; }
  #status { font-weight: 600; }
  #status.on { color: var(--ok); } #status.off { color: var(--errfg); }
  #desc { font-size: 12px; color: var(--muted); min-height: 1.4em; }
  #clients { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  #clients span { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  #log { display: grid; gap: 4px; max-height: 70vh; overflow: auto; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .entry { border-radius: 6px; padding: 5px 8px; background: var(--in); overflow-wrap: anywhere; }
  .entry.out { background: var(--out); } .entry.error { background: var(--err); color: var(--errfg); }
  .entry b { font-weight: 700; }
  .entry .meta { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>WebSocket·MQTT 인터페이스 시험 <small id="endpoint" style="font-weight:400;color:var(--muted)"></small></h1>
  <section aria-label="접속과 보내기">
    <h2>접속</h2>
    <div class="row">
      <label>역할<select id="role"><option value="gui">gui</option><option value="robot">robot</option></select></label>
      <label>이름<input id="name" value="nurse-ui" autocomplete="off"></label>
    </div>
    <div class="row">
      <button id="connect">접속</button><button id="disconnect" class="secondary" disabled>끊기</button>
    </div>
    <div>상태: <span id="status" class="off">끊김</span></div>
    <div id="clients" aria-label="접속한 클라이언트"></div>
    <h2>보내기</h2>
    <label>메시지 종류<select id="type"></select></label>
    <div id="desc"></div>
    <label>받는 쪽 (to) — 이름 또는 * (받는 역할 전체)<input id="to" value="*" autocomplete="off"></label>
    <label>payload (JSON)<textarea id="payload" spellcheck="false"></textarea></label>
    <div class="row"><button id="send" disabled>보내기</button><button id="clear" class="secondary">기록 지우기</button></div>
  </section>
  <section aria-label="주고받은 메시지">
    <h2>주고받은 메시지 (최근 것이 위)</h2>
    <div id="log"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let specs = null, socket = null;
const clients = new Map();
$('endpoint').textContent = `ws://${location.host || 'localhost:8765'}`;

function newId() { return Math.random().toString(16).slice(2, 14); }

function renderClients() {
  $('clients').replaceChildren(...[...clients].map(([name, role]) => {
    const chip = document.createElement('span'); chip.textContent = `${name} · ${role}`; return chip;
  }));
}

function log(direction, message) {
  const entry = document.createElement('div');
  entry.className = 'entry ' + (direction === '>>' ? 'out' : '') + (message.type === 'error' ? ' error' : '');
  const time = (message.ts || new Date().toISOString()).slice(11, 19);
  entry.innerHTML = `<span class="meta">${time} ${direction}</span> <b></b> <span class="meta"></span><div></div>`;
  entry.querySelector('b').textContent = message.type;
  entry.querySelectorAll('.meta')[1].textContent = `from=${message.from} to=${message.to}`;
  entry.querySelector('div').textContent = JSON.stringify(message.payload);
  $('log').prepend(entry);
}

function fillTypes() {
  const role = $('role').value;
  const sendable = Object.entries(specs.messages).filter(([, spec]) => spec.senders.includes(role));
  $('type').replaceChildren(...sendable.map(([type]) => new Option(type, type)));
  fillSample();
}

function fillSample() {
  const type = $('type').value, spec = specs.messages[type];
  $('desc').textContent = spec ? `${spec.senders.join('/')} → ${spec.receivers.join('/')} · ${spec.description}` : '';
  $('payload').value = JSON.stringify(specs.samples[type] || {}, null, 2);
}

function setConnected(on) {
  $('status').textContent = on ? '접속됨' : '끊김';
  $('status').className = on ? 'on' : 'off';
  $('connect').disabled = on; $('disconnect').disabled = !on; $('send').disabled = !on;
  $('role').disabled = on; $('name').disabled = on;
}

$('connect').onclick = () => {
  const host = location.host || 'localhost:8765';
  socket = new WebSocket(`ws://${host}/?role=${encodeURIComponent($('role').value)}&name=${encodeURIComponent($('name').value.trim())}`);
  socket.onopen = () => setConnected(true);
  socket.onclose = event => {
    setConnected(false); clients.clear(); renderClients();
    if (event.reason) log('<<', { type: 'error', from: 'server', to: '', payload: { code: 'closed', detail: event.reason } });
  };
  socket.onmessage = event => {
    const message = JSON.parse(event.data);
    log('<<', message);
    if (message.type === 'hello') { clients.clear(); message.payload.connected.forEach(c => clients.set(c.name, c.via ? `${c.role} (${c.via})` : c.role)); renderClients(); }
    if (message.type === 'presence') {
      const p = message.payload;
      if (p.online) clients.set(p.client_name, p.via ? `${p.role} (${p.via})` : p.role);
      else clients.delete(message.payload.client_name);
      renderClients();
    }
  };
};
$('disconnect').onclick = () => socket && socket.close();
$('send').onclick = () => {
  let payload;
  try { payload = JSON.parse($('payload').value || '{}'); }
  catch (error) { log('<<', { type: 'error', from: 'page', to: '', payload: { code: 'invalid_json', detail: String(error) } }); return; }
  const message = { id: newId(), type: $('type').value, to: $('to').value.trim() || '*', ts: new Date().toISOString(), payload };
  socket.send(JSON.stringify(message));
  log('>>', { ...message, from: $('name').value });
};
$('clear').onclick = () => $('log').replaceChildren();
$('role').onchange = () => { $('name').value = $('role').value === 'robot' ? 'pinky_1' : 'nurse-ui'; fillTypes(); };
$('type').onchange = fillSample;

fetch('/specs.json').then(response => response.json()).then(data => { specs = data; fillTypes(); })
  .catch(() => { $('desc').textContent = '규격(/specs.json)을 못 읽었습니다 — server.py가 준 주소로 여세요'; });
</script>
</body>
</html>
