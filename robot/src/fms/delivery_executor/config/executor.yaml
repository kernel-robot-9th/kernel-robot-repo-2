# 배송 실행기 설정 (ROS 파라미터 파일이 아닌 일반 YAML). 계약: dev_ws/docs/api_contract_delivery_2026-10-20.md
# 키 파일은 저장소 밖에 두고 권한 600: EMR 장소·맵·로봇 화면 → 로봇 탭 → 키 발급 → 파일에 한 줄로 저장

emr_url: http://localhost:8000/api/v1   # 관제 PC에서 돌면 localhost. 다른 PC면 http://<EMR PC IP>:8000/api/v1
claim_period_s: 3.0         # 배송을 가져갈지 묻는 주기
navigation_timeout_s: null  # 주행 한 번의 제한 시간(초). null = 없음 — 로봇 작업이 끝날 때까지 기다린다(2026-10-22 사용자 결정). 숫자를 넣으면 넘을 때 취소·실패
map_wait_s: 10.0            # (navigation: ros) 시작할 때 로봇 /map을 기다리는 시간 (EMR 맵과 같은지 확인)
receipt_debounce_s: 3.0     # (receipt_markers: true) 카메라가 같은 마커 번호를 계속 내보내도 이 간격에 한 번만 EMR에 보낸다
receipt_poll_s: 2.0         # 수령 대기 중 /robot/me 확인 주기 — "받았습니다" 버튼 수령을 알아차림 (2026-10-22)
navigation_poll_s: 1.0      # 주행 중 확인 주기 (pinky_api: GET /jobs/{id}). 주행은 비동기 — 보내 놓고 반복마다 확인 (2026-10-22)

robots:
  pinky_1:
    emr_robot_id: 1                 # EMR robots.id — 키가 이 로봇 것인지 시작할 때 확인한다
    api_key_file: ~/.config/delivery_executor/pinky_1.key
    blocked_location_ids: []        # 가면 안 되는 장소(EMR locations.id). 2026-10-22 비품실(1) 금지 해제 (사용자 결정)

    # 주행 (2026-10-22): pinky_api = 팀원 Pinky API(로봇 :8080, 인증 없음 — 지금은 인증 없이 진행) | ros = Nav2 직접
    navigation: pinky_api
    pinky_api: http://192.168.129.122:8080
    # 목적지 이름은 EMR 장소의 '로봇 목적지'(robot_dest, 2026-10-22)를 쓴다 — emr/backend/scripts/import_pinky_dests.py로 채움.
    # 아래 dests 표는 덮어쓰기용(정밀 주차 등). EMR 장소 id → Pinky 목적지 이름(GET /dests — 2026-10-22에 /stops에서 이름이 바뀜). 표에 없는 장소는 움직이지 않고 failed destination_blocked.
    # 복귀 장소(EMR 로봇 탭에서 고른 장소)도 표에 있어야 한다. 정밀 주차는 {dest: PHARMACY, dock: true}
    dests:
      9: {dest: PHARMACY, dock: true}   # 약제실 OMX — Nav2로는 칸 마지막 구간이 104로 실패, 카메라 정밀 주차로 들어감 (2026-10-22 실측)

    # 수령 마커 (2026-10-22, 사용자 결정: 일단 끔). false면 마커를 읽지 않고 "받았습니다" 버튼 수령만 기다린다.
    # 되살리려면 true + EMR .env NURSE_RECEIPT_METHOD=marker (ROS 토픽 receipt_marker를 읽으므로 ros_domain_id 필요)
    receipt_markers: false

    # navigation: ros 또는 receipt_markers: true일 때만 쓴다
    ros_domain_id: 0                # Pinky 1대 시험은 0 (여러 대면 11·12·13 — docs/pinky_multi_robot_2026-10-20.md)
    namespace: ''                   # Pinky upstream은 namespace를 지원하지 않는다 — 도메인으로 나눈다
