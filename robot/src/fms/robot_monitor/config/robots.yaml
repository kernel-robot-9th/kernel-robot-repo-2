# Robot monitor settings (plain YAML, not a ROS parameter file).
# Separate this file per deployment (PC, Docker) instead of changing code.

http:
  host: 0.0.0.0      # where GET /api/robots is served
  port: 8090

publish_period_s: 1.0      # /fms/robot_states and the HTTP stream
offline_after_s: 3.0       # no message from the robot for this long -> state "offline"
battery_low_percent: 20.0  # battery.low flag
map_frame: map
base_frame: base_footprint

# One entry per robot. namespace '' = the robot's topics are at the root (one Pinky as shipped).
# emr_robot_id = robots.id in the EMR (for matching; the monitor does not call the EMR).
robots:
  pinky_1:
    namespace: ''
    emr_robot_id: 1
