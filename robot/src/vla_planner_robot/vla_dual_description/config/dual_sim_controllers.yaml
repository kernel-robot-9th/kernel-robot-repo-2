/**:
  controller_manager:
    ros__parameters:
      update_rate: 100  # Hz
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      left_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController
      right_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController
      left_gripper_controller:
        type: position_controllers/GripperActionController
      right_gripper_controller:
        type: position_controllers/GripperActionController

/**:
  left_arm_controller:
    ros__parameters:
      joints: [left_joint1, left_joint2, left_joint3, left_joint4, left_joint5]
      command_interfaces: [position]
      state_interfaces: [position, velocity]
      allow_partial_joints_goal: true

/**:
  right_arm_controller:
    ros__parameters:
      joints: [right_joint1, right_joint2, right_joint3, right_joint4, right_joint5]
      command_interfaces: [position]
      state_interfaces: [position, velocity]
      allow_partial_joints_goal: true

/**:
  left_gripper_controller:
    ros__parameters:
      joint: left_gripper_joint_1

/**:
  right_gripper_controller:
    ros__parameters:
      joint: right_gripper_joint_1

# gz_ros2_control turns position commands into velocity commands with this P gain;
# the default 0.1 leaves ~0.04 rad steady-state error under gravity (see vla_sim).
/**:
  gz_ros_control:
    ros__parameters:
      position_proportional_gain: 1.0
