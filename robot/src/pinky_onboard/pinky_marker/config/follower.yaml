# nurse_follower 파라미터 (ROS 파라미터 파일). 단위는 이름에
nurse_follower:
  ros__parameters:
    target_id: 2                  # 따라갈 간호사 마커 (nurses.yaml에 있어야 함)
    dictionary: 4x4_250           # 간호사 0~49 + 일회용 50~249. 따라가기는 0~49만
    image_qos: reliable           # best_effort면 0.9 MB 영상이 거의 안 들어온다 (2026-10-20 측정)
    enabled_on_start: true        # false면 ~/enable 서비스로 켤 때까지 가만히
    marker_size_m: 0.05           # 검정 정사각형 한 변 (EMR 인쇄 카드 50 mm)
    focal_px: 500.0               # 카메라 초점 거리 — 보정 전 가정값 (거리 추정에만 씀)
    follow_distance_m: 0.30
    max_linear_mps: 0.10
    max_backward_mps: 0.05
    max_angular_radps: 0.5
    stop_timeout_s: 0.5
    lost_timeout_s: 3.0
    invert_x: true                # Pinky 카메라가 180° 돌아 달림
    debug: false
