<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMS 단계별 비교</title>
<style>
/* 발표 영상 (11-02): demo_quad.py 가 띄운 시뮬레이터 4개를 2×2 로. 각 칸 = 그 시뮬레이터의 ?bare=1 화면 */
html, body { margin: 0; height: 100%; background: #1d1d1b; }
.grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; height: 100vh; }
iframe { width: 100%; height: 100%; border: 0; display: block; background: #f6f6f3; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
// 칸: [포트, 제목] — demo_quad.py 의 PANELS 와 같아야 함 (11-03: 번호 없이, 3분할과 같은 이름)
const PANELS = [
  [8781, '로봇 1대'],                         // FMS 없음 · 순차 처리
  [8782, 'MAPF Baseline (CBS)'],             // 처음 CBS · 주차·직선 이어 달리기 없음 · 수술실 먼저를 모름
  [8783, '+ Task Allocation · 주행 연결'],    // 오염도 기반 배정 + 주차 9곳 + 직선 이어 달리기
  [8784, '+ MAPF 고도화'],                   // CBS 고도화 + 약제실 앞 대기열
];
const host = location.hostname || 'localhost';
document.getElementById('grid').innerHTML = PANELS.map(([port, title]) =>
  `<iframe src="http://${host}:${port}/?bare=1&title=${encodeURIComponent(title)}" title="${title}"></iframe>`).join('');
</script>
</body>
</html>
